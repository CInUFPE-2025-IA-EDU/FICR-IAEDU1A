<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Portfólio</title>
    <link rel="stylesheet" href="./styles/projetos.css"> 
</head>
<body>

    <header class="site-header">
        <div class="logo">
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="habilidades.html">Habilidades</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="depoimentos.html">Depoimentos</a></li>
                <li><a href="case-de-sucesso.html">Case de Sucesso</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="section-projetos-intro">
            <h2>Vamos Conversar?</h2>
            <p>
                Tem um projeto em mente ou quer tirar uma dúvida? Preencha o formulário abaixo.
            </p>
        </section>

        <section style="max-width: 600px; margin: 0 auto;">
            <div class="project-card" style="padding: 2.5rem;">
                <form action="mailto:seuemail@exemplo.com" method="post" enctype="text/plain">
                    
                    <div style="margin-bottom: 1.5rem;">
                        <label for="nome" style="display: block; margin-bottom: 0.5rem; color: #1e293b; font-weight: 600;">Nome Completo</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome" 
                               style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95rem; box-sizing: border-box;">
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <label for="email" style="display: block; margin-bottom: 0.5rem; color: #1e293b; font-weight: 600;">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="Digite seu e-mail" 
                               style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95rem; box-sizing: border-box;">
                    </div>

                    <div style="margin-bottom: 2rem;">
                        <label for="mensagem" style="display: block; margin-bottom: 0.5rem; color: #1e293b; font-weight: 600;">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Como podemos ajudar?" 
                                  style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95rem; resize: vertical; box-sizing: border-box;"></textarea>
                    </div>

                    <button type="submit" 
                            style="background: #276ef1; color: white; border: none; padding: 14px 28px; border-radius: 50px; cursor: pointer; font-size: 1rem; font-weight: 600; width: 100%; transition: background .2s; box-shadow: 0 4px 14px rgba(39, 110, 241, 0.4);">
                        Enviar Mensagem
                    </button>
                </form>
            </div>
        </section>

    </main>

    <footer>
        <p>Todos os direitos reservados | 2025</p>
    </footer>

</body>
</html>
